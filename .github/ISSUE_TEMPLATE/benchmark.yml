name: Historical evidence or benchmark proposal
description: Propose a source-verified reference, dataset, scorer, or protocol change.
title: "evidence: "
labels: [research]
body:
  - type: input
    id: source
    attributes:
      label: Primary source URL and locator
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Exact dated model and condition
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Benchmark, split, metric, denominator, attempts, scorer, and protocol
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Evidence class
      options: [published historical reference, archived-response reanalysis, context-only/incompatible, proposed local measurement]
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Rights, access, and redistribution notes
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication checks
      options:
        - label: This proposal contains no restricted prompts, raw model responses, PII, secrets, or private paths.
          required: true
        - label: I have not treated an unknown field as zero or inferred a snapshot from an alias.
          required: true
