name: Sanitized bug report
description: Report a reproducible workbench defect using synthetic inputs.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, PII, private paths, raw model logs, restricted tasks, or desktop screenshots."
  - type: input
    id: version
    attributes:
      label: Project version or commit
    validations:
      required: true
  - type: dropdown
    id: evidence
    attributes:
      label: Run type
      options: [mock/synthetic, local measurement, no model run]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include commands and synthetic input only; redact local identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Publication checks
      options:
        - label: I removed PII, secrets, private paths, raw outputs/reasoning, restricted benchmark content, and screenshots.
          required: true
