name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: source, mocks, references, privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LOCAL_EVALS_TEST_MODE: "mock-only"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 source: github.com/actions/checkout
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$GITLEAKS_URL" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0 source: github.com/astral-sh/setup-uv
        with:
          version: 0.12.17
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked lightweight development environment
        run: uv sync --frozen --extra dev --extra evalscope
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Unit, scorer, mock transport, reference, and privacy tests
        run: uv run pytest
      - name: Audit public source and complete Git history
        env:
          LOCAL_EVALS_STATE_DIR: ${{ runner.temp }}/splash-evals-state
          PUBLIC_GIT_AUTHOR_NAME: Racecraft Lab Automation
          PUBLIC_GIT_AUTHOR_EMAIL: info@racecraft.co
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_PROVENANCE_EVIDENCE: ${{ runner.temp }}/splash-evals-github-provenance.json
        run: |
          git config --local user.name "$PUBLIC_GIT_AUTHOR_NAME"
          git config --local user.email "$PUBLIC_GIT_AUTHOR_EMAIL"
          if test -n "$PR_HEAD_SHA"; then
            git checkout --detach "$PR_HEAD_SHA"
          fi
          uv run python scripts/collect_github_provenance.py \
            --output "$GITHUB_PROVENANCE_EVIDENCE" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --head-sha "$(git rev-parse --verify HEAD)"
          uv run local-evals privacy audit --scope publication
      - name: Validate historical catalog
        run: uv run local-evals frontier validate --catalog references/frontier
      - name: Privacy gate tests
        run: uv run pytest tests/unit/test_publication.py
      - name: Build and inspect distributions
        run: |
          uv build
          uv run python scripts/inspect_release.py dist

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0 source: github.com/actions/dependency-review-action
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  final-gate:
    name: final gate
    if: always()
    needs: [quality, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
      DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Require every applicable lane
        shell: bash
        run: |
          test "$QUALITY_RESULT" = "success"
          if test "$EVENT_NAME" = "pull_request"; then
            test "$DEPENDENCY_RESULT" = "success"
          else
            test "$DEPENDENCY_RESULT" = "skipped"
          fi
