name: Draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable semantic version tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  build:
    name: build, scan, and inspect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      audited-sha: ${{ steps.audited-source.outputs.sha }}
    env:
      LOCAL_EVALS_TEST_MODE: "mock-only"
    steps:
      - name: Checkout protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 source: github.com/actions/checkout
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind audited source
        id: audited-source
        run: printf 'sha=%s\n' "$(git rev-parse --verify HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$GITLEAKS_URL" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - name: Validate requested tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo 'tag must be an explicit semantic version' >&2
            exit 1
          fi
      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0 source: github.com/astral-sh/setup-uv
        with:
          version: 0.12.17
          enable-cache: false
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev
      - name: Test source and publication controls
        env:
          LOCAL_EVALS_STATE_DIR: ${{ runner.temp }}/splash-evals-state
          PUBLIC_GIT_AUTHOR_NAME: Racecraft Lab Automation
          PUBLIC_GIT_AUTHOR_EMAIL: info@racecraft.co
          GH_TOKEN: ${{ github.token }}
          GITHUB_PROVENANCE_EVIDENCE: ${{ runner.temp }}/splash-evals-github-provenance.json
        run: |
          git config --local user.name "$PUBLIC_GIT_AUTHOR_NAME"
          git config --local user.email "$PUBLIC_GIT_AUTHOR_EMAIL"
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src
          uv run pytest
          uv run local-evals frontier validate --catalog references/frontier
          uv run python scripts/collect_github_provenance.py \
            --output "$GITHUB_PROVENANCE_EVIDENCE" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --head-sha "${{ steps.audited-source.outputs.sha }}"
          uv run local-evals privacy audit --scope publication
      - name: Build distributions and minimal dependency SBOM
        run: |
          uv build
          uv export --format cyclonedx1.5 --no-dev --output-file dist/sbom.cdx.json
      - name: Inspect exact archive members
        run: |
          uv run python scripts/inspect_release.py dist
          gitleaks dir dist --redact --no-banner --no-color
      - name: Create checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
      - name: Upload sanitized release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 source: github.com/actions/upload-artifact
        with:
          name: release-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest-and-draft:
    name: attest and create draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download only this workflow's reviewed artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 source: github.com/actions/download-artifact
        with:
          name: release-candidate
          path: release-artifacts
      - name: Verify checksums
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS
      - name: Attest sanitized artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2 source: github.com/actions/attest
        with:
          subject-path: |
            release-artifacts/*.whl
            release-artifacts/*.tar.gz
            release-artifacts/sbom.cdx.json
            release-artifacts/SHA256SUMS
      - name: Create draft prerelease for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          printf '%s\n' \
            'Draft only; maintainer review is required before publication.' \
            'Artifacts contain project code/docs, a wheel, sdist, CycloneDX SBOM, checksums, and provenance; they never contain raw prompts/responses, model weights, or private state.' \
            'The published local pilot is small and synthetic. Its post-hoc, order-reversed comparison is exploratory, does not prove improvement/equivalence, and supports no direct historical frontier delta.' \
            'The earlier candidate locality remains attribution-provisional.' \
            'From a clean checkout, reproduce with: uv sync --frozen --extra dev; LOCAL_EVALS_TEST_MODE=mock-only uv run pytest; uv run local-evals frontier validate --catalog references/frontier; uv run local-evals privacy audit --scope publication; uv build; uv export --format cyclonedx1.5 --no-dev --output-file dist/sbom.cdx.json; uv run python scripts/inspect_release.py dist.' \
            'See docs/local-pilot-results.md, docs/methodology.md, and docs/operations.md.' \
            'Attestations establish provenance only; they do not certify capability, security, or privacy.' > release-notes.md
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.build.outputs.audited-sha }}" \
            --title "$RELEASE_TAG (draft prerelease)" \
            --notes-file release-notes.md \
            --draft \
            --prerelease
