name: Docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-docs-github-pages' || format('docs-check-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: validate and upload docs artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 source: github.com/actions/checkout
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6 source: github.com/actions/setup-node
        with:
          node-version: 22
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.25.0 --activate
      - name: Install locked docs dependencies
        run: pnpm --dir docs-site install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir docs-site exec playwright install --with-deps chromium
      - name: Prepare fixed docs artifact path
        run: python3 scripts/docs_artifact.py prepare docs-site/dist
      - name: Validate Starlight site, links, and rendered routes
        run: pnpm --dir docs-site validate
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "$GITLEAKS_URL" --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$bin_dir"
          tar -xzf "$archive" -C "$bin_dir" gitleaks
          "$bin_dir/gitleaks" dir docs-site/dist --redact --no-banner --no-color
      - name: Verify fixed docs artifact
        run: python3 scripts/docs_artifact.py verify docs-site/dist
      - name: Verify site contains no forbidden private-state filenames
        run: |
          if find docs-site/dist -type f \( -name '.env*' -o -name '*.log' -o -name '*.db' -o -name '*.sqlite*' -o -name '*.ipynb' \) -print -quit | grep -q .; then
            echo 'forbidden file category in Pages output' >&2
            exit 1
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 source: github.com/actions/upload-pages-artifact
        with:
          path: docs-site/dist
          retention-days: 1

  deploy:
    name: deploy reviewed documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0 source: github.com/actions/configure-pages
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 source: github.com/actions/deploy-pages
