[project]
name = "splash-evals"
version = "0.1.0"
description = "Local-only Splash evaluation through LM Studio with qualified historical references"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
evalscope = ["evalscope[service]>=1.0,<2"]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
local-evals = "local_evals.cli:app"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_evals"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.env.example",
  "/.github",
  "/AGENTS.md",
  "/docs-site",
  "/docs/github-feature-audit.md",
  "/tests",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["local_evals"]
